<!-- Stories Section -->
<div class="w3-container" style="padding:128px 16px" id="work">
  <h3 class="w3-center">STORIES</h3>
  <p class="w3-center w3-large">How our dogs got rescued and what are they up to now. <br> Try clicking the pictures!</p>

  <div class="w3-row-padding" style="margin-top:64px">
    <div class="w3-col l3 m6">
      <img src="story1.avif" style="width:100%" onclick="onClick(this)" class="w3-hover-opacity" alt="a woman petting a dog" data-caption="Tilly’s world is quiet. She flinches at loud sounds and hides behind her bed. But she peeks out when someone’s kind. She’s still waiting—for the gentle home that will finally feel safe enough to stay.">
    </div>
    <div class="w3-col l3 m6">
      <img src="story2.webp" style="width:100%" onclick="onClick(this)" class="w3-hover-opacity" alt="a woman hugging a dog" data-caption="Hapi wagged his tail the moment he met Alice, his new owner. Now he naps on couches, runs in fields and sleeps next to Alice every night. He was named before he was happy, but now the name fits.">
    </div>
    <div class="w3-col l3 m6">
      <img src="story3.jpg" style="width:100%" onclick="onClick(this)" class="w3-hover-opacity" alt="a small black dog" data-caption="Jojo’s been returned twice. Not his fault, just bad matches. He’s goofy, high-energy, and needs someone who gets him. He’s still waiting, still hopeful. We are too. The right person is out there.">
    </div>
    <div class="w3-col l3 m6">
      <img src="story4.jpg" style="width:100%" onclick="onClick(this)" class="w3-hover-opacity" alt="an older man hugging a dog" data-caption="Kiki was quiet and withdrawn until she met her adopter, an older gentleman who had just lost his wife. They connected instantly. She sits beside him every day now. We think they saved each other.">
    </div>
  </div>

  <div class="w3-row-padding w3-section">
    <div class="w3-col l3 m6">
      <img src="story5.jpg" style="width:100%" onclick="onClick(this)" class="w3-hover-opacity" alt="dog sniffing human hand" data-caption="Gigi, Kiki’s sister, was adopted by the old man’s neighbor a week later. The best part? The two sisters still get to see each other almost daily. It’s rare, but sometimes everything just works out.">
    </div>
    <div class="w3-col l3 m6">
      <img src="story6.jpg" style="width:100%" onclick="onClick(this)" class="w3-hover-opacity" alt="an old dog" data-caption="Roggo, the dog that started it all, was skinny, sick and terrified when Hanna (the adoption center's founder) took him in herself. He’s 12 now, graying, but still full of heart. He’s the reason this whole place exists.">
    </div>
    <div class="w3-col l3 m6">
      <img src="story7.jpg" style="width:100%" onclick="onClick(this)" class="w3-hover-opacity" alt="medium sized dog smiling" data-caption="Elvis has so much energy it’s like he’s made of springs. He loves the beach, car rides, and chasing waves. He’s still waiting for an active home that can keep up. Until then, we keep him busy.">
    </div>
    <div class="w3-col l3 m6">
      <img src="story8.jpg" style="width:100%" onclick="onClick(this)" class="w3-hover-opacity" alt="small dog going threw a agility obsticle" data-caption="Kippis was fast, focused, and fearless, so we matched him with a woman looking for an agility dog. Now they travel all over Poland winning medals. We’re proud, but not surprised. He was born for it.">
    </div>
  </div>
</div>

<!-- JavaScript -->
<script>
  // Modal Image Gallery using data-caption
  function onClick(element) {
    document.getElementById("img01").src = element.src;
    document.getElementById("modal01").style.display = "block";
    var captionText = document.getElementById("caption");
    captionText.innerHTML = element.getAttribute("data-caption");
  }

  // Sidebar toggle
  var mySidebar = document.getElementById("mySidebar");

  function w3_open() {
    if (mySidebar.style.display === 'block') {
      mySidebar.style.display = 'none';
    } else {
      mySidebar.style.display = 'block';
    }
  }

  function w3_close() {
    mySidebar.style.display = "none";
  }
</script>
